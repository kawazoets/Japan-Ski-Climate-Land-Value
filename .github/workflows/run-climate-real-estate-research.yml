name: Run climate and real estate research
run-name: Climate and real estate research (1996-2026 target)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: climate-real-estate-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit 30-year research coverage
        run: python scripts/audit_thirty_year_research_readiness.py
      - name: Recompute national climate and land-price association
        run: python scripts/analyze_national_ski_snow_land.py
      - name: Test robustness of preliminary results
        run: python scripts/audit_national_ski_snow_land_robustness.py
      - name: Build research status and interpretation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("reports/climate_real_estate_research_latest.md")
          p.write_text("""# 日本のスキーリゾート地域：気候変動と不動産価値

          ## 研究対象
          不動産価格：1996–2026年。気象観測：1986–2026年を基準とする。

          ## 現時点の到達点
          既存データから全国のスキー場周辺の地価変化（2016–2026年）と冬季積雪指標（2016–2025年）の予備的な関係を再計算した。**30年間の地価データと40年間の気象データはまだ取得できておらず、温暖化の不動産価値への影響について最終結論を出す段階ではない。**

          ## 検証結果
          - [全国予備分析](national_ski_snow_land_exploratory_association.md)
          - [感度分析](national_ski_snow_land_robustness.md)
          - [長期データ不足・必要な追加取得](thirty_year_research_data_gate.md)

          ## 未解決の研究上の問題
          - 1996年以降の一貫した地価地点パネルを作る必要がある。
          - 1986年以降の気温・積雪を同一観測条件で比較する必要がある。
          - 観光投資、都市化、人口、標高、地域別価格トレンドの交絡を調整する必要がある。
          - 相関を因果関係と解釈してはならない。

          このワークフローは既存の検証を再実行するものであり、未取得の30年分を自動取得したと偽らない。
          """,encoding="utf-8")
          PY
      - name: Save reproducible reports
        uses: actions/upload-artifact@v4
        with:
          name: climate-real-estate-research-results
          path: |
            reports/climate_real_estate_research_latest.md
            reports/thirty_year_research_data_gate.*
            reports/national_ski_snow_land_exploratory_association.md
            reports/national_ski_snow_land_robustness.md
            data/ski_snow_land_exploratory_matched_2016_2026.csv
      - name: Publish reports to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/climate_real_estate_research_latest.md reports/thirty_year_research_data_gate.json reports/thirty_year_research_data_gate.md reports/national_ski_snow_land_exploratory_association.md reports/national_ski_snow_land_robustness.md data/ski_snow_land_exploratory_matched_2016_2026.csv
          if ! git diff --cached --quiet; then
            git commit -m "Refresh climate and real estate research findings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
