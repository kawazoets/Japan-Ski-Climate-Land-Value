name: Diagnose JMA station selector format
on:
  push:
    paths:
      - 'scripts/diagnose_jma_station_selector.py'
      - '.github/workflows/diagnose-jma-station-selector.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python scripts/diagnose_jma_station_selector.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/jma_station_selector_html_diagnostics.md
          git diff --cached --quiet && exit 0
          git commit -m "Document actual JMA station selector HTML and script dependencies"
          git pull --rebase origin main
          git push origin HEAD:main
