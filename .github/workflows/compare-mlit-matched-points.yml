name: Compare matched 2016 and 2026 land-price points
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/compare_mlit_matched_points.py
      - name: Commit matched-point comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mlit_municipality_matched_2016_2026.csv reports/mlit_matched_2016_2026_audit.md
          if ! git diff --cached --quiet; then
            git commit -m "Save matched-point 2016 to 2026 land-price changes"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
