name: Collect ski area candidates (OSM, unverified)
on:
  workflow_dispatch:
  schedule:
    - cron: '31 3 1 * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collect_osm_candidates.py
      - name: Commit candidate list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm_ski_candidates.csv
          git diff --cached --quiet || (git commit -m "Refresh unverified OSM ski candidates" && git push)
