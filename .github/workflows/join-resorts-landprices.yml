name: Join ski areas to official land-price points
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/join_31_resorts_mlit.py
      - name: Commit proximity results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resort_landprice_nearest_2026.csv reports/resort_landprice_proximity_2026.md
          if ! git diff --cached --quiet; then
            git commit -m "Save exploratory resort-to-land-price spatial join"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
