name: Complete nationwide ski climate and land-value research
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover nationwide 1986-2025 climate series
        run: python scripts/acquire_national_ski_reanalysis_1986_2025.py
      - name: Recalculate integrated climate and land-price results
        run: python scripts/final_ski_climate_land_value_research.py
      - name: Commit climate and research results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ski_region_reanalysis_climate_1986_2025.csv reports/ski_region_reanalysis_climate_1986_2025.md reports/final_ski_climate_land_value_research_ja.md
          if ! git diff --cached --quiet; then
            git commit -m "Recover nationwide climate and recalculate property-value findings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Check final climate coverage
        run: |
          python - <<'PY'
          import csv,collections
          with open('data/ski_region_reanalysis_climate_1986_2025.csv',encoding='utf-8') as f: rows=list(csv.DictReader(f))
          counts=collections.Counter(r['candidate_id'] for r in rows if r['mean_temperature_c'])
          complete=sum(n==40 for n in counts.values())
          print('Full 40-year climate series for land-price eligible regions:',complete,'of 44')
          if complete<40:
              raise SystemExit('Insufficient climate coverage for 30-year land-price eligible regions; partial data saved')
          PY
