name: Collect ten winters of official JMA Furano snow
on:
  push:
    paths:
      - 'data/jma_furano_daily_snow_pilot_2025.csv'
      - 'scripts/collect_jma_furano_history.py'
      - '.github/workflows/collect-jma-furano-history.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Require verified pilot before full download
        run: |
          test -s data/jma_furano_daily_snow_pilot_2025.csv
      - name: Collect historical real daily snow depth at low request rate
        run: python scripts/collect_jma_furano_history.py
      - name: Calculate winter-season snow indicators
        run: python scripts/aggregate_jma_winter_snow.py
      - name: Commit observations and indicators
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jma_daily_snow_depth_2016_2026.csv data/jma_snow_winter_season_metrics_2016_2025.csv
          git diff --cached --quiet && exit 0
          git commit -m "Store actual JMA Furano 2016–2025 daily snow-depth histories and winter metrics"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jma-furano-10-winters
          path: |
            data/jma_daily_snow_depth_2016_2026.csv
            data/jma_snow_winter_season_metrics_2016_2025.csv
          if-no-files-found: ignore
