name: Collect one complete JMA Furano winter
on:
  push:
    paths:
      - 'scripts/collect_jma_furano_2024_winter.py'
      - '.github/workflows/collect-jma-furano-2024-winter.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python -u scripts/collect_jma_furano_2024_winter.py
      - name: Commit validated full winter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jma_furano_daily_snow_2024_winter.csv
          git diff --cached --quiet && exit 0
          git commit -m "Collect complete 2024-25 Furano snow season"
          git pull --rebase origin main
          git push origin HEAD:main
