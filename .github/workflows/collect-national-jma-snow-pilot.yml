name: Collect nationwide JMA station pilot snow observations
on:
  push:
    paths:
      - 'data/jma_historical_block_number_candidates.csv'
      - 'scripts/collect_national_jma_snow_pilot.py'
      - '.github/workflows/collect-national-jma-snow-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python -u scripts/collect_national_jma_snow_pilot.py
      - name: Save official data and explicit failure statuses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jma_nationwide_snow_pilot_2024_winter.csv data/jma_nationwide_snow_pilot_collection_status.csv
          git diff --cached --quiet && exit 0
          git commit -m "Save nationwide JMA snow observation pilot and per-station failures"
          git pull --rebase origin main
          git push origin HEAD:main
