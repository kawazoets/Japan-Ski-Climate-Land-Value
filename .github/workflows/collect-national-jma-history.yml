name: Nationwide ten-winter JMA snow history
on:
  push:
    paths:
      - 'scripts/collect_national_jma_snow_history.py'
      - '.github/workflows/collect-national-jma-history.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3, 4]
      max-parallel: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python -u scripts/collect_national_jma_snow_history.py ${{ matrix.batch }}
      - name: Save batch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jma-history-batch-${{ matrix.batch }}
          path: |
            data/jma_national_snow_history_batch_*.csv
  merge:
    needs: history
    if: always() && needs.history.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all verified winter histories
        uses: actions/download-artifact@v4
        with:
          pattern: jma-history-batch-*
          merge-multiple: true
          path: data
      - name: Commit nationwide historical observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jma_national_snow_history_batch_*.csv
          git diff --cached --quiet && exit 0
          git commit -m "Save ten winter seasons for 14 verified nationwide JMA stations"
          git pull --rebase origin main
          git push origin HEAD:main
