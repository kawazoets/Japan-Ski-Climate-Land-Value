name: Audit resort operating-season evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_operating_seasons.py'
      - 'data/resort_operating_season_evidence.csv'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_operating_seasons.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/operating_season_evidence_audit.md data/resort_operating_season_evidence.csv
          if ! git diff --cached --quiet; then
            git commit -m "Audit source-backed resort operating seasons"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
