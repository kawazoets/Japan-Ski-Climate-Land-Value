name: Build nationwide climate land-value evidence matrix
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_national_evidence_matrix.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_national_evidence_matrix.py
      - name: Commit evidence matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national_climate_landvalue_evidence_matrix.csv reports/national_climate_landvalue_evidence_status.md
          if ! git diff --cached --quiet; then
            git commit -m "Create nationwide climate-land value evidence matrix"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
