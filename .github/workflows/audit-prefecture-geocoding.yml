name: Audit national resort geographic coverage
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_prefecture_geocoding.py'
      - 'data/national_resort_osm_reconciliation.csv'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_prefecture_geocoding.py
      - name: Save coverage audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prefecture_resort_geocoding_coverage.csv reports/prefecture_geocoding_coverage.md
          if ! git diff --cached --quiet; then
            git commit -m "Audit nationwide resort geocoding coverage by prefecture"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
