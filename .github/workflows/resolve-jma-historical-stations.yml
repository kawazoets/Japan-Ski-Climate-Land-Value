name: Resolve nationwide JMA historical station URLs
on:
  push:
    paths:
      - 'scripts/resolve_jma_historical_station_blocks.py'
      - '.github/workflows/resolve-jma-historical-stations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python -u scripts/resolve_jma_historical_station_blocks.py
      - name: Collect nationwide station pilot in the same run
        run: python -u scripts/collect_national_jma_snow_pilot.py
      - name: Commit resolved official JMA station links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jma_historical_block_number_candidates.csv reports/jma_historical_station_resolution.md data/jma_nationwide_snow_pilot_2024_winter.csv data/jma_nationwide_snow_pilot_collection_status.csv
          git diff --cached --quiet && exit 0
          git commit -m "Resolve JMA historical station block identifiers nationwide"
          git pull --rebase origin main
          git push origin HEAD:main
