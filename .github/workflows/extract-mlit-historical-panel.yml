name: Extract historical MLIT land-price panel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/extract_mlit_historical_panel.py
      - uses: actions/upload-artifact@v4
        with:
          name: mlit-historical-point-year-panel
          path: data/mlit_landprice_historical_panel_1983_2026.csv
          retention-days: 30
      - name: Save audit only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mlit_historical_panel_audit.md
          if ! git diff --cached --quiet; then
            git commit -m "Audit official MLIT historical price panel"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
