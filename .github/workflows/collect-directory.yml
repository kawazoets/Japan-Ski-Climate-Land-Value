name: Collect directory candidates
on:
  push:
    paths:
      - 'scripts/collect_directory.py'
      - '.github/workflows/collect-directory.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 4 2 * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: directory-collection-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collect_directory.py
      - name: Commit candidate index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/directory_candidates.csv
          if ! git diff --cached --quiet; then
            git commit -m "Refresh directory candidate index"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
            echo "Push failed after retries" >&2
            exit 1
          fi
