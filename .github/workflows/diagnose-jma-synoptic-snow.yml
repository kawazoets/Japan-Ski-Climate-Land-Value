name: Diagnose JMA synoptic snow stations
on:
  push:
    paths:
      - 'scripts/diagnose_jma_synoptic_snow.py'
      - '.github/workflows/diagnose-jma-synoptic-snow.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python scripts/diagnose_jma_synoptic_snow.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/jma_synoptic_snow_table_diagnostics.md
          git diff --cached --quiet && exit 0
          git commit -m "Inspect JMA synoptic station snow depth column layouts"
          git pull --rebase origin main
          git push origin HEAD:main
