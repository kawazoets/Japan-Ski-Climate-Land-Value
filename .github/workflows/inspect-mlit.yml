name: Inspect official 2026 MLIT land-price archive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect_mlit_archive.py
      - name: Commit archive inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mlit_archive_inspection.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified official land-price archive inspection"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
