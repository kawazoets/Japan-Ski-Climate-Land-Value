name: Inspect official JMA snow station master
on:
  push:
    paths:
      - 'scripts/inspect_jma_snow_station_master.py'
      - '.github/workflows/inspect-jma-snow-station-master.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and inspect official JMA station master
        run: python scripts/inspect_jma_snow_station_master.py
      - name: Commit evidence of actual source format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/jma_official_snow_station_master_inventory.md
          git diff --cached --quiet && exit 0
          git commit -m "Record observed JMA snow-station master structure"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save inspection result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jma-snow-station-master-inventory
          path: reports/jma_official_snow_station_master_inventory.md
          if-no-files-found: ignore
