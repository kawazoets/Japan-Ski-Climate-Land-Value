name: Collect OSM ski resort coordinate candidates
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collect_osm_resort_geocandidates.py
      - name: Commit candidate coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm_resort_geocandidates.csv reports/osm_geocandidate_collection_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record OSM resort coordinate candidates"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
