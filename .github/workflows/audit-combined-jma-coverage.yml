name: Audit combined nationwide JMA snow coverage
on:
  push:
    paths:
      - 'scripts/audit_combined_jma_coverage.py'
      - '.github/workflows/audit-combined-jma-coverage.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_combined_jma_coverage.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/national_jma_100_station_coverage_audit.md
          git diff --cached --quiet && exit 0
          git commit -m "Publish combined national JMA snow observation coverage audit"
          git pull --rebase origin main
          git push origin HEAD:main
