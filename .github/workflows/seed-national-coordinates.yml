name: Seed national ski resort coordinates from existing OSM data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/seed_national_resort_coordinates.py
      - name: Commit coordinate seeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national_ski_resort_geocoded_seed.csv reports/national_geocoding_seed_audit.md
          if ! git diff --cached --quiet; then
            git commit -m "Seed nationwide resort coordinates from existing OSM records"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
