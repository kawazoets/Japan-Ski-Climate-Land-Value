name: Rebuild nationwide ski resort candidate master
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_national_resort_master.py
      - name: Commit national inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national_ski_resort_candidate_master.csv reports/national_resort_coverage_audit.md
          if ! git diff --cached --quiet; then
            git commit -m "Retain complete nationwide resort candidate inventory"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
