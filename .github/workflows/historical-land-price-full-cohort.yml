name: Historical land-price full cohort analysis
on:
  push:
    paths:
      - 'data/raw/L01-26_GML.zip'
      - 'scripts/extract_historical_mlit_land_prices.py'
      - 'scripts/link_national_mlit_resort_prices.py'
      - '.github/workflows/historical-land-price-full-cohort.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official shapefile reader
        run: python -m pip install pyshp
      - name: Extract 2016–2026 actual land prices
        run: python scripts/extract_historical_mlit_land_prices.py
      - name: Match 451 resorts with real MLIT price observations
        run: python scripts/link_national_mlit_resort_prices.py
      - name: Verify real data and summary
        run: |
          python - <<'PY'
          import csv
          def read(p):
              with open(p,encoding="utf-8-sig",newline="") as f:return list(csv.DictReader(f))
          points=read('data/MLIT_land_prices_2016_2026.csv')
          summary=read('data/ski_resort_mlit_buffer_summary_2016_2026.csv')
          assert len(points)==267086,len(points)
          assert len(summary)==451*4,len(summary)
          print('Validated',len(points),'point-years and',len(summary),'resort/radius rows')
          PY
      - name: Commit actual full-cohort results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/MLIT_land_prices_2016_2026.csv data/ski_resort_mlit_point_pairs_2016_2026.csv data/ski_resort_mlit_buffer_summary_2016_2026.csv reports/ski_resort_land_price_full_cohort.md
          git diff --cached --quiet && exit 0
          git commit -m "Analyze nationwide 2016–2026 observed MLIT land-price changes near ski resorts"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve results as artifact even if commit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-historical-ski-land-prices
          path: |
            data/MLIT_land_prices_2016_2026.csv
            data/ski_resort_mlit_point_pairs_2016_2026.csv
            data/ski_resort_mlit_buffer_summary_2016_2026.csv
            reports/ski_resort_land_price_full_cohort.md
          if-no-files-found: ignore
