name: Final ski climate and land value research report
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  final-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/final_ski_climate_land_value_research.py
      - name: Save final Japanese research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/final_ski_climate_land_value_research_ja.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish final climate and ski-region land-value report"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
